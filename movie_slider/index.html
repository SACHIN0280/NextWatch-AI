<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Slider Component</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
    
    body {
      font-family: 'Inter', sans-serif !important;
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #FFFFFF;
    }
    
    ::-webkit-scrollbar { display: none; }
    
    .slider-wrapper {
        position: relative;
        padding: 0 1rem;
        margin-bottom: 2rem;
        max-width: 1200px;
        margin: 0 auto;
    }
    .slider-row {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 2rem;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .center-row {
        justify-content: center;
        flex-wrap: wrap;
    }
    .slider-item {
        flex: 0 0 180px; 
        scroll-snap-align: start;
    }
    .slider-btn {
        position: absolute;
        top: 45%;
        transform: translateY(-50%);
        z-index: 10;
        background: rgba(15, 23, 42, 0.8);
        color: #FFFFFF;
        border: 1px solid rgba(255,255,255,0.08);
        font-size: 2.5rem;
        padding: 1rem 0.5rem;
        cursor: pointer;
        opacity: 0;
        transition: all 0.3s ease;
        height: 90%;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        border-radius: 8px;
    }
    .slider-wrapper:hover .slider-btn { opacity: 1; }
    .slider-btn:hover { background: #1E293B; color: #FF1E1E; }
    .left-btn { left: 0; border-radius: 0 8px 8px 0; }
    .right-btn { right: 0; border-radius: 8px 0 0 8px; }
    
    .movie-card {
        position: relative;
        background: #0F172A;
        aspect-ratio: 2 / 3;
        border-radius: 12px;
        transition: transform 0.3s ease, z-index 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        z-index: 1;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        height: 270px;
    }
    .movie-card:hover {
        transform: scale(1.05) translateY(-8px);
        z-index: 100;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(255, 30, 30, 0.2);
    }
    
    .movie-info { 
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 2rem 1rem 1rem 1rem;
        background: linear-gradient(to top, rgba(5,7,13,1) 0%, rgba(5,7,13,0.9) 60%, transparent 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .movie-card:hover .movie-info { opacity: 1; }
    
    .movie-title {
        color: #FFFFFF;
        font-weight: 800;
        font-size: 1.1rem;
        margin-bottom: 0.3rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .movie-rating {
        color: #46d369; 
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
    }
    .movie-overview {
        color: #CBD5E1;
        font-size: 0.75rem;
        margin-bottom: 0.5rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .genre-tag {
        color: #CBD5E1;
        font-size: 0.75rem;
        margin-right: 0.3rem;
    }
    .genre-tag::after { content: ' •'; color: rgba(255,255,255,0.2); margin-left: 0.3rem; }
    .genre-tag:last-child::after { content: ''; }
    
    .poster-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .no-poster {
        background: #0F172A;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #CBD5E1;
        font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    /**
     * Send a message to the Streamlit parent window.
     */
    function sendMessageToStreamlitClient(type, data) {
      var outData = Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data);
      window.parent.postMessage(outData, "*");
    }

    /**
     * Notify Streamlit that this component is ready to receive messages.
     */
    function init() {
      sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
    }

    /**
     * Set the component's value and trigger a rerun in Streamlit.
     */
    function sendValue(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
    }

    /**
     * Handle the data sent from Streamlit.
     */
    window.addEventListener("message", function(event) {
      if (event.data.type !== "streamlit:render") return;

      const args = event.data.args;
      const movies = args.movies || [];
      const mode = args.mode || "slider"; // "slider" or "grid"
      
      let html = '<div class="slider-wrapper">';
      
      if (mode === "slider" && movies.length > 5) {
        html += '<button class="slider-btn left-btn" onclick="this.nextElementSibling.scrollBy({left: -600, behavior: \'smooth\'})">&#10094;</button>';
      }
      
      let rowClass = mode === "grid" ? "slider-row center-row" : "slider-row";
      html += `<div class="${rowClass}">`;
      
      for (let m of movies) {
        let posterHtml = m.poster ? `<img src="${m.poster}" class="poster-img">` : `<div class='no-poster'>No Poster</div>`;
        let genresHtml = (m.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join("");
        
        // When clicking the card, send the ID back to Python
        html += `<div class="slider-item">
          <div class="movie-card" onclick="sendValue('${m.id}')">
            ${posterHtml}
            <div class="movie-info">
              <div class="movie-title">${m.title}</div>
              <div class="movie-rating">${m.rating}</div>
              ${genresHtml ? `<div style="margin-bottom:0.5rem;">${genresHtml}</div>` : ""}
              <div class="movie-overview">${m.overview}</div>
            </div>
          </div>
        </div>`;
      }
      
      html += '</div>';
      
      if (mode === "slider" && movies.length > 5) {
        html += '<button class="slider-btn right-btn" onclick="this.previousElementSibling.scrollBy({left: 600, behavior: \'smooth\'})">&#10095;</button>';
      }
      
      html += '</div>';
      
      document.getElementById("root").innerHTML = html;
      
      // Tell Streamlit how tall our iframe needs to be
      sendMessageToStreamlitClient("streamlit:setFrameHeight", {
        height: mode === "grid" ? document.body.scrollHeight : 350
      });
    });

    // Initialize component
    init();
  </script>
</body>
</html>
